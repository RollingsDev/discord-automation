name: Riot Enhancements Smoke

on:
  push:
    paths:
      - '.trigger-riot-report-smoke'

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none
      - name: Testar Daily
        env:
          WEBHOOK_RIOT: ${{ secrets.WEBHOOK_RIOT }}
        run: php scripts/riot-daily-report.php

  mastery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none
      - name: Testar Mastery
        env:
          WEBHOOK_RIOT: ${{ secrets.WEBHOOK_RIOT }}
        run: php scripts/riot-mastery-report.php
