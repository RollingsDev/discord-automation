name: Dev Watch

on:
  workflow_dispatch:
    inputs:
      force_latest:
        description: 'Enviar a versão mais recente como teste'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '27 12 * * *'
    - cron: '27 21 * * *'

permissions:
  contents: write

concurrency:
  group: discord-automation-dev-watch
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none

      - name: Verificar versões
        env:
          WEBHOOK_DEV: ${{ secrets.WEBHOOK_DEV }}
          FORCE_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_latest || false }}
        run: php scripts/dev-watch.php

      - name: Persistir estado
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- .state/dev-watch.json)" ]; then
            echo 'Nenhuma alteração de estado para registrar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .state/dev-watch.json
          git commit -m 'chore: update dev watch state'
          git pull --rebase origin main
          git push
