name: Riot Bot — Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oraculo-riot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: bot/tft-worker

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_LOL_CHANNEL_ID: ${{ secrets.DISCORD_LOL_CHANNEL_ID }}
      DISCORD_TFT_CHANNEL_ID: ${{ secrets.DISCORD_TFT_CHANNEL_ID }}

      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      RIOT_TFT_API_KEY: ${{ secrets.RIOT_TFT_API_KEY }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Validar configuração obrigatória
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            DISCORD_PUBLIC_KEY \
            DISCORD_APP_ID \
            DISCORD_GUILD_ID \
            DISCORD_BOT_TOKEN \
            RIOT_API_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret obrigatório ausente: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validar JavaScript
        run: |
          node --check src/worker.js
          node --check src/riot-live.js
          node --check src/tft-snapshot.js
          node --check src/commands.js
          node --check scripts/register-commands.mjs

      - name: Criar ou atualizar Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/oraculo-riot-deploy.log

      - name: Sincronizar secrets no Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          put_secret() {
            local name="$1"
            local value="${!name:-}"

            if [ -z "$value" ]; then
              echo "${name}: não configurado; ignorando."
              return 0
            fi

            printf '%s' "$value" | npx wrangler secret put "$name"
            echo "${name}: sincronizado."
          }

          put_secret DISCORD_PUBLIC_KEY
          put_secret RIOT_API_KEY
          put_secret RIOT_TFT_API_KEY
          put_secret DISCORD_GUILD_ID
          put_secret DISCORD_LOL_CHANNEL_ID
          put_secret DISCORD_TFT_CHANNEL_ID

      - name: Registrar comandos /lol e /tft no Discord
        run: node scripts/register-commands.mjs

      - name: Resumo do deploy
        if: always()
        shell: bash
        run: |
          {
            echo '## Oráculo Riot'
            echo
            if [ -f /tmp/oraculo-riot-deploy.log ]; then
              worker_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/oraculo-riot-deploy.log | tail -1 || true)
              if [ -n "$worker_url" ]; then
                echo "**Worker:** $worker_url"
                echo
                echo "Use essa URL uma única vez como **Interactions Endpoint URL** no Discord Developer Portal."
              else
                echo 'O Worker foi processado, mas a URL workers.dev não foi detectada no log.'
              fi
            fi
            echo
            echo '- /lol registrado pelo workflow'
            echo '- /tft registrado pelo workflow'
            echo '- RIOT_TFT_API_KEY é opcional até a chave TFT ser aprovada'
          } >> "$GITHUB_STEP_SUMMARY"
