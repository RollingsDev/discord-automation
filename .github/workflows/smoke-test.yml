name: Smoke Test — Discord Automations

on:
  push:
    paths:
      - '.trigger-smoke'

jobs:
  free-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none
      - name: Testar Jogos Grátis
        env:
          WEBHOOK_FREE_GAMES: ${{ secrets.WEBHOOK_FREE_GAMES }}
          FORCE_LATEST: 'true'
        run: php scripts/free-games.php

  dev-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none
      - name: Testar Dev Watch
        env:
          WEBHOOK_DEV: ${{ secrets.WEBHOOK_DEV }}
          FORCE_LATEST: 'true'
        run: php scripts/dev-watch.php

  riot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, dom
          coverage: none
      - name: Testar Riot
        env:
          WEBHOOK_RIOT: ${{ secrets.WEBHOOK_RIOT }}
          FORCE_LATEST: 'true'
        run: php scripts/riot-patches.php

  fortnite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, dom, simplexml
          coverage: none
      - name: Testar Fortnite
        env:
          WEBHOOK_FORTNITE: ${{ secrets.WEBHOOK_FORTNITE }}
          FORCE_LATEST: 'true'
        run: php scripts/fortnite.php

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none
      - name: Testar Security
        env:
          WEBHOOK_SECURITY: ${{ secrets.WEBHOOK_SECURITY }}
          FORCE_LATEST: 'true'
        run: php scripts/security-watch.php

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none
      - name: Testar Entregas Zona Norte
        env:
          WEBHOOK_DELIVERY: ${{ secrets.WEBHOOK_DELIVERY }}
          FORCE_POST: 'true'
        run: php scripts/delivery-advisor.php
