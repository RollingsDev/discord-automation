name: Entregas SP — Zona Norte

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar publicação do boletim'
        required: false
        default: true
        type: boolean

  schedule:
    - cron: '35 13 * * *'
    - cron: '35 19 * * *'
    - cron: '35 22 * * *'

permissions:
  contents: write

concurrency:
  group: discord-automation-delivery
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: none

      - name: Publicar boletim Zona Norte
        env:
          WEBHOOK_DELIVERY: ${{ secrets.WEBHOOK_DELIVERY }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: php scripts/delivery-advisor.php

      - name: Persistir estado
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- .state/delivery-advisor.json)" ]; then
            echo 'Nenhuma alteração de estado para registrar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .state/delivery-advisor.json
          git commit -m 'chore: update delivery advisor state'
          git pull --rebase origin main
          git push
