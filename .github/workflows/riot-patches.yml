name: Riot Patch Watch

on:
  workflow_dispatch:
    inputs:
      force_latest:
        description: 'Enviar patches recentes de LoL e TFT como teste'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '7 13 * * *'
    - cron: '7 22 * * *'

permissions:
  contents: write

concurrency:
  group: discord-automation-riot-patches
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, dom
          coverage: none

      - name: Verificar patches Riot
        env:
          WEBHOOK_RIOT: ${{ secrets.WEBHOOK_RIOT }}
          FORCE_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_latest || false }}
        run: php scripts/riot-patches.php

      - name: Persistir estado
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- .state/riot-patches.json)" ]; then
            echo 'Nenhuma alteração de estado para registrar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .state/riot-patches.json
          git commit -m 'chore: update riot patches state'
          git pull --rebase origin main
          git push
