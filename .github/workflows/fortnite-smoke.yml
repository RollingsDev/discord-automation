name: Fortnite Smoke Test

on:
  push:
    paths:
      - '.trigger-fortnite-smoke'

jobs:
  fortnite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, simplexml
          coverage: none
      - name: Testar Fortnite
        env:
          WEBHOOK_FORTNITE: ${{ secrets.WEBHOOK_FORTNITE }}
          FORCE_LATEST: 'true'
        run: php scripts/fortnite.php
