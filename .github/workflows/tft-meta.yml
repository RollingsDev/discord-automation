name: TFT Meta

on:
  workflow_dispatch:
  schedule:
    - cron: '37 11 * * *'
    - cron: '37 21 * * *'

permissions:
  contents: write

concurrency:
  group: discord-automation-tft-meta
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, dom
          coverage: none

      - name: Atualizar e publicar TFT Meta
        env:
          WEBHOOK_TFT_META: ${{ secrets.WEBHOOK_TFT_META }}
        run: php scripts/tft-meta-report.php

      - name: Persistir snapshot TFT
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- .state/tft-meta.json)" ]; then
            echo 'Nenhum snapshot novo para registrar.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .state/tft-meta.json
          git commit -m 'chore: update TFT meta snapshot'
          git pull --rebase origin main
          git push
