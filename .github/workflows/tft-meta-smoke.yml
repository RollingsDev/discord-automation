name: TFT Meta Smoke

on:
  push:
    paths:
      - '.trigger-tft-meta'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, dom
          coverage: none

      - name: Validar sintaxe
        run: |
          php -l src/Tft/TftMetaSource.php
          php -l scripts/tft-meta-report.php

      - name: Testar parsing TFT
        env:
          DRY_RUN: 'true'
        run: php scripts/tft-meta-report.php

      - name: Debug estrutura da comp
        run: php scripts/tft-meta-debug.php
